<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Based Threat Detection</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/ai_based_detection.css">
</head>
<body>
    <div class="hero">
        <div class="container0">
            <h1>AI-Based Threat Detection</h1>
            <p>Enter a URL to analyze potential threats using AI.</p>
        </div>
    </div>
    <hr>

    <form id="ai-threat-form" method="POST" action="/ai_threat_detection">
        <div class="parent1">
            <div class="div1">
                <input type="url" id="ai-url" name="ai-url" placeholder="https://example.com..." required />
            </div>
            <div class="div2">
                <button type="submit" title="Detect Threat">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="20" height="20">
                        <path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/>
                    </svg>
                </button>
            </div>
        </div>
        <div class="result-card" id="ai-threat-result" style="display: none;">
            {% if result %}
                {{ result }}
                <script>
                    document.getElementById('ai-threat-result').style.display = 'block';
                </script>
            {% endif %}
        </div>
    </form>

    <script src="../static/ai_based_detection.js"></script>
</body>
</html>
